name: Core

on:
  push:
    branches-ignore:
      - main
      - MOODLE_[0-9]+_STABLE
    tags-ignore:
      - v[0-9]+.[0-9]+.[0-9]+*
  schedule:
    - cron: '0 3 * * 3'
      timezone: 'America/Los_Angeles'
  workflow_dispatch:
    inputs:
      phpunit_extra_options:
        description: Additional options to apply to PHPUnit
        required: false
        default: ''

env:
  php: 8.4
  moodle-branch: MOODLE_502_STABLE

jobs:
  Grunt:
    runs-on: ubuntu-24.04

    steps:
      - name: Checking out Moodle ${{ matrix.moodle-branch }}
        uses: actions/checkout@v6
        with:
          repository: moodle/moodle
          ref: ${{ env.moodle-branch }}

      - name: Checking out kaltura moodle_plugin code
        uses: actions/checkout@v6
        with:
          path: plugin

      - name: Installing plugins
        run: |
          rsync -av \
            --exclude='.*' \
            --exclude='*.sh' \
            --exclude='composer.json' \
            plugin/public/ public/
 
      - name: Configuring node & npm
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Installing node stuff
        run: npm install

      - name: Running grunt
        run: npx grunt

      # - name: Looking for uncommitted changes
      #   # Add all files to the git index and then run diff --cached to see all changes.
      #   # This ensures that we get the status of all files, including new files.
      #   # We ignore npm-shrinkwrap.json to make the tasks immune to npm changes.
      #   run: |
      #     git add .
      #     git reset -- npm-shrinkwrap.json
      #     git diff --cached --exit-code

  PHPUnit:
    runs-on: ${{ matrix.os }}
    services:
      exttests:
        image: moodlehq/moodle-exttests
        ports:
          - 8080:80
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: ${{ matrix.db == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        include:
          # MySQL builds always run with the lowest PHP supported version.
          - os: ubuntu-24.04
            php: 8.4
            extensions:
            db: mysqli
          # Disable testing with PostgreSQL for now since we are not using it.
          # PostgreSQL builds always run with the highest PHP supported version.
          # - os: ubuntu-24.04
          #   php: 8.4
          #   db: pgsql

    steps:
      - name: Run MySQL Server
        if: ${{ matrix.db == 'mysqli' }}
        run: |
          docker run --rm \
            -e MYSQL_DATABASE=test \
            -e MYSQL_USER=test \
            -e MYSQL_PASSWORD=test \
            -e MYSQL_ROOT_PASSWORD=test \
            -p 3306:3306 \
            -d \
            --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024M \
            mysql:8.4 \
              --skip-log-bin \
              --collation-server=utf8mb4_bin

      - name: Configuring git vars
        uses: rlespinasse/github-slug-action@v4

      - name: Setting up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Checking out code from ${{ env.GITHUB_REF_SLUG }}
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Checking out Moodle ${{ matrix.moodle-branch }}
        uses: actions/checkout@v6
        with:
          repository: moodle/moodle
          ref: ${{ env.moodle-branch }}
          path: moodle

      - name: Applying MDL-87086 patch
        working-directory: moodle
        run: |
          git remote add ctam https://github.com/ctam/moodle.git
          git fetch ctam MDL-87086-${{ env.moodle-branch }}
          ## git merge does not always work, with merge unrelated history error.
          # git merge --no-edit FETCH_HEAD
          ## So, we use cherry-pick instead.
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git cherry-pick 6535f1e1e610bdee7b319f7203e47f17f051fec1

      - name: Installing plugins
        run: |
          rsync -av \
            --exclude='.*' \
            --exclude='*.sh' \
            --exclude='composer.json' \
            plugin/ moodle/public/

      - name: Setting up PHPUnit
        working-directory: moodle
        env:
          dbtype: ${{ matrix.db }}
        run: |
          echo "pathtophp=$(which php)" >> $GITHUB_ENV # Inject installed pathtophp to env. The template config needs it.
          cp .github/workflows/config-template.php config.php
          mkdir ../moodledata
          sudo locale-gen en_AU.UTF-8
          php public/admin/tool/phpunit/cli/init.php --no-composer-self-update

      - name: Running PHPUnit tests
        working-directory: moodle
        env:
          dbtype: ${{ matrix.db }}
          phpunit_options: ${{ secrets.phpunit_options }}
        run: vendor/bin/phpunit $phpunit_options ${{ inputs.phpunit_extra_options }}

      - name: Git status
        working-directory: plugin
        run: git status
